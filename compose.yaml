services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: umamusume-rag-postgres
    environment:
      POSTGRES_DB: umamusume_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on the host to avoid clashing with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d umamusume_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
